<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071225">
  <meta name="description" content="Explorador animado de mapas conceptuales creados en draw.io.">
  <title>Mapa interactivo de antenas</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%230b1830'/%3E%3Ccircle cx='32' cy='34' r='5' fill='%2360a5fa'/%3E%3Cpath d='M21 27a15 15 0 0 1 22 0M14 19a25 25 0 0 1 36 0M32 39v12' fill='none' stroke='%23f8fafc' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand" aria-label="Mapa interactivo de antenas">
        <span class="brand-mark" aria-hidden="true">
          <span></span><span></span><i></i>
        </span>
        <span class="brand-copy"><strong>Mapa interactivo</strong><small>Antenas y telecomunicaciones</small></span>
      </div>

      <nav class="scene-nav" aria-label="Navegación por el mapa">
        <button class="nav-button is-active" data-action="fit" type="button">Vista general</button>
        <button class="nav-button" data-section="1" type="button"><span>01</span> Antenas WiFi</button>
        <button class="nav-button" data-section="2" type="button"><span>02</span> Satelital</button>
        <button class="nav-button" data-section="3" type="button"><span>03</span> Aplicaciones</button>
        <button class="nav-button" data-section="4" type="button"><span>04</span> Fenómenos</button>
      </nav>

      <div class="top-actions">
        <button class="icon-button tour-button" data-action="tour" type="button" aria-label="Iniciar recorrido por las cuatro secciones">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
          <span>Recorrido</span>
        </button>
        <label class="import-button" for="file-input">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0-12 4 4m-4-4L8 7M5 14v5h14v-5"/></svg>
          <span>Importar draw.io</span>
        </label>
        <button class="icon-button fullscreen-button" data-action="fullscreen" type="button" aria-label="Entrar en pantalla completa" title="Pantalla completa" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3m13-5h3a2 2 0 0 1 2 2v3M3 16v3a2 2 0 0 0 2 2h3m8 0h3a2 2 0 0 0 2-2v-3"/></svg>
        </button>
        <input id="file-input" type="file" accept=".drawio,.xml,.drawio.xml,text/xml,application/xml" hidden>
      </div>
    </header>

    <section class="viewport" id="viewport" aria-label="Mapa conceptual interactivo">
      <div class="atmosphere" aria-hidden="true">
        <div class="orb orb-one"></div><div class="orb orb-two"></div>
        <div class="grid"></div>
      </div>
      <div class="map-world" id="map-world"></div>

      <aside class="hint" id="hint">
        <span class="hint-mouse" aria-hidden="true"><i></i></span>
        Arrastra para moverte · rueda para acercar
      </aside>

      <div class="zoom-controls" aria-label="Controles de zoom">
        <button type="button" data-action="zoom-in" aria-label="Acercar">+</button>
        <button type="button" data-action="zoom-out" aria-label="Alejar">−</button>
        <button type="button" data-action="actual-size" aria-label="Mostrar al 100%">100%</button>
      </div>

      <div class="tour-progress" id="tour-progress" aria-hidden="true"><i></i></div>

      <footer class="statusbar">
        <span class="file-state"><i></i><span id="file-name">Mapa original</span></span>
        <span id="map-message">Selecciona una sección para explorarla</span>
        <span class="zoom-value" id="zoom-value">—</span>
      </footer>

      <div class="toast" id="toast" role="status" aria-live="polite"></div>
      <div class="loading" id="loading" aria-live="polite">
        <span class="loading-ring"></span>
        <span>Cargando mapa…</span>
      </div>
    </section>
  </main>
  <script src="./js/app.js" defer></script>
</body>
</html>
